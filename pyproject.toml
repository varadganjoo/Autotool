[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotool"
version = "0.1.0"
description = "Self-synthesizing MCP agent runtime: writes, verifies and hot-loads its own FastMCP tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "anthropic>=1.0,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "anyio>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[project.scripts]
autotool = "autotool.main:cli"

[tool.setuptools.packages.find]
include = ["autotool*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
