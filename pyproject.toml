[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autotool-mcp"
version = "0.1.0"
description = "A self-extending tool layer for any AI agent: your agent writes the tools it needs; AutoTool verifies, guards and mounts them, and gives them API keys by name only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Varad Ganjoo", email = "varadganjoo@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "model context protocol", "agents", "llm", "tools", "claude code", "codex", "cursor", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx2>=2.13,<3",
    "pydantic>=2.13,<3",
    "anyio>=4.15,<5",
    "python-dotenv>=1.2,<2",
    "keyring>=25.7,<26",
]

[project.optional-dependencies]
# Only for synthesize_tool (AutoTool writes tools with its own model key) and the `autotool run` demo agent.
models = ["openai>=3.19,<4", "anthropic>=1.8,<2"]
dev = ["autotool-mcp[models]", "pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/varadganjoo/Autotool"
Repository = "https://github.com/varadganjoo/Autotool"
Issues = "https://github.com/varadganjoo/Autotool/issues"

[project.scripts]
autotool = "autotool.cli:main"
autotool-mcp = "autotool.cli:main"

[tool.setuptools.packages.find]
include = ["autotool*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:autotool.*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["paper/results"]  # tools the agents wrote during the experiments, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
    "E501",      # the formatter owns line length
    "ASYNC240",  # reading a small local script before mounting it; a thread hop buys nothing
]

[tool.ruff.lint.per-file-ignores]
"scripts/auth_benchmark.py" = ["RUF001"]  # matches the Unicode minus and apostrophes models write
